# ============================================================
#  KAIHARA OS — Configuration
# ============================================================

[system]
name = "Kaihara"
version = "0.1.0"
data_dir = "./data"
obsidian_vault = "./obsidian-vault"
log_level = "INFO"
language = "ms"

# ============================================================
#  MODEL ROUTING
# ============================================================

[model]
default = "rootsys/glm-5.2"
small_model = "rootsys/deepseek-v4-flash"
reflex_model = "rootsys/deepseek-v4-flash"
fallback_chain = ["9router/ag/gemini-3-flash", "ollama/llama3.2:1b"]

# ============================================================
#  PROVIDERS
# ============================================================

[provider.rootsys]
name = "RootSys Cloud"
base_url = "https://rootsys.cloud/v1"
api_key_header = "X-API-Key"

[provider.ollama]
name = "Ollama (local)"
base_url = "http://192.168.1.99:11434/v1"

[provider.9router]
name = "9Router (free proxy)"
base_url = "http://192.168.1.41:20128/v1"
api_key_header = "Authorization"

# ============================================================
#  AGENT MODEL ROUTING
# ============================================================

[agent.kaihara]
model = "rootsys/glm-5.2"
variant = "default"

[agent.reflex]
model = "rootsys/deepseek-v4-flash"
variant = "low"

[agent.deep_reasoner]
model = "rootsys/glm-5.3"
variant = "high"

[agent.coding]
model = "rootsys/kimi-k3"

[agent.research]
model = "rootsys/glm-5.2"

[agent.marketing]
model = "rootsys/glm-5.2"

[agent.security]
model = "rootsys/glm-5.3"
variant = "think"

[agent.deploy]
model = "rootsys/deepseek-v4-flash"

[agent.storage]
model = "rootsys/deepseek-v4-flash"

[agent.notification]
model = "rootsys/deepseek-v4-flash"

[agent.meta]
model = "rootsys/deepseek-v4-flash"

# ============================================================
#  MODEL VARIANTS
# ============================================================

[model.llama3_1.variants.low]
num_ctx = 8192
temperature = 0.3

[model.llama3_1.variants.high]
num_ctx = 32768
temperature = 0.7

[model.llama3_1.variants.think]
num_ctx = 65536
temperature = 0.5

# ============================================================
#  PRIVACY MODE
# ============================================================

[privacy]
mode = false   # false = allow cloud providers
enforce_in_core = false

# ============================================================
#  MEMORY
# ============================================================

[memory]
db_path = "./data/kaihara.db"
context_window = 20
daily_compression_hour = 3
auto_fetch_interval = 20

[memory.recall]
bm25_weight = 0.4
vector_weight = 0.4
graph_weight = 0.2
rrf_k = 60

# ============================================================
#  TOKENJUICE
# ============================================================

[tokenjuice]
enabled = true
output_compression = true
input_compression = true
shell_compression = true
cache_originals = true
drop_compression_on = ["security", "approval", "destructive"]

# ============================================================
#  SECURITY
# ============================================================

[security]
approval_required = [
    "deploy_to_production",
    "push_to_git",
    "send_email",
    "send_whatsapp",
    "send_telegram",
    "run_pentest",
    "delete_file",
    "execute_shell",
    "spend_money",
    "install_package",
]
sandbox_enabled = true
audit_log = "./data/audit.log"

# ============================================================
#  CHANNELS
# ============================================================

[channel.telegram]
enabled = true
allowed_chat_ids = ["8275355102"]

[channel.whatsapp]
enabled = false

[channel.email]
enabled = false

[channel.dashboard]
enabled = true
port = 7000

# ============================================================
#  VOICE
# ============================================================

[voice]
enabled = true
piper_path = "/opt/piper/piper"
tts_voice = "/opt/piper/voices/en_US-lessac-medium.onnx"

# ============================================================
#  INFRASTRUCTURE
# ============================================================

[server]
host = "0.0.0.0"
port = 7000
websocket_enabled = true

[monitoring]
grafana_enabled = false

[git]
gitea_url = ""

[proxmox]
enabled = false

[gdrive]
enabled = false
