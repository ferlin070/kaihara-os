# ============================================================
#  KAIHARA OS — Configuration
# ============================================================

[system]
name = "Kaihara"
version = "0.1.0"
data_dir = "./data"
obsidian_vault = "./obsidian-vault"
log_level = "INFO"
language = "ms"

# ============================================================
#  MODEL ROUTING
# ============================================================

[model]
default = "ollama/llama3.1:8b"
small_model = "ollama/llama3.2:1b"
reflex_model = "openrouter/nvidia/nemotron-3.5-lightning:free"
fallback_chain = ["9router/ag/gemini-3-flash", "ollama/llama3.2:1b"]

# ============================================================
#  PROVIDERS
# ============================================================

[provider.ollama]
name = "Ollama (local)"
base_url = "http://192.168.1.99:11434/v1"

[provider.9router]
name = "9Router (free proxy)"
base_url = "http://192.168.1.41:20128/v1"
api_key_header = "Authorization"

[provider.opencode-zen]
name = "OpenCode Zen (free models)"
base_url = "https://opencode.ai/zen/v1"
api_key_header = "Authorization"
[provider.openrouter]
name = "OpenRouter (free models)"
base_url = "https://openrouter.ai/api/v1"
api_key_header = "Authorization"


# ============================================================
#  AGENT MODEL ROUTING
# ============================================================

[agent.kaihara]
model = "ollama/llama3.1:8b"
variant = "default"

[agent.reflex]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"
variant = "low"

[agent.deep_reasoner]
model = "9router/ag/gemini-3-flash"
variant = "high"

[agent.coding]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"

[agent.research]
model = "openrouter/nvidia/nemotron-3-super-120b-a12b:free"

[agent.marketing]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"

[agent.security]
model = "9router/ag/gemini-3-flash"
variant = "think"

[agent.deploy]
model = "openrouter/poolside/laguna-s-2.1:free"

[agent.storage]
model = "openrouter/poolside/laguna-s-2.1:free"

[agent.notification]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"

[agent.meta]
model = "openrouter/nvidia/nemotron-3.5-lightning:free"

# ============================================================
#  MODEL VARIANTS
# ============================================================

[model.llama3_1.variants.low]
num_ctx = 8192
temperature = 0.3

[model.llama3_1.variants.high]
num_ctx = 32768
temperature = 0.7

[model.llama3_1.variants.think]
num_ctx = 65536
temperature = 0.5

# ============================================================
#  PRIVACY MODE
# ============================================================

[privacy]
mode = false   # false = allow cloud providers
enforce_in_core = false

# ============================================================
#  MEMORY
# ============================================================

[memory]
db_path = "./data/kaihara.db"
context_window = 20
daily_compression_hour = 3
auto_fetch_interval = 20

[memory.recall]
bm25_weight = 0.4
vector_weight = 0.4
graph_weight = 0.2
rrf_k = 60

# ============================================================
#  TOKENJUICE
# ============================================================

[tokenjuice]
enabled = true
output_compression = true
input_compression = true
shell_compression = true
cache_originals = true
drop_compression_on = ["security", "approval", "destructive"]

# ============================================================
#  SECURITY
# ============================================================

[security]
approval_required = [
    "deploy_to_production",
    "push_to_git",
    "send_email",
    "send_whatsapp",
    "send_telegram",
    "run_pentest",
    "delete_file",
    "execute_shell",
    "spend_money",
    "install_package",
]
sandbox_enabled = true
audit_log = "./data/audit.log"

# ============================================================
#  CHANNELS
# ============================================================

[channel.telegram]
enabled = false
allowed_chat_ids = ["8275355102"]

[channel.whatsapp]
enabled = true

[channel.email]
enabled = false

[channel.dashboard]
enabled = true
port = 7000

# ============================================================
#  VOICE
# ============================================================

[voice]
enabled = true
piper_path = "/opt/piper/piper"
tts_voice = "/opt/piper/voices/en_US-lessac-medium.onnx"

# ============================================================
#  INFRASTRUCTURE
# ============================================================

[server]
host = "0.0.0.0"
port = 7000
websocket_enabled = true

[monitoring]
grafana_enabled = false

[git]
gitea_url = ""

[proxmox]
enabled = false

[gdrive]
enabled = false

# ============================================================
#  WORKFLOW ENGINE
# ============================================================

[workflow]
db_path = "./data/workflows.db"
max_concurrent = 3
default_timeout = 300

[workflow.approval]
required_steps = ["outreach", "deploy_site"]
timeout_seconds = 600

[workflow.targets]
demo_domain = "nakhodacloud.top"
production_platform = "vercel"

[workflow.biz_autopilot]
default_niche = "restoran"
default_location = "Johor Bahru"
default_channel = "email"
lead_scoring_threshold = 50

# ============================================================
#  GOOGLE FLOW MCP (AI Image/Video Generation)
# ============================================================

[google_flow]
enabled = true
headless = false
timeout = 60000
user_data_dir = "./data/chrome-profile"

[google_flow.generation]
default_style = "default"
default_aspect_ratio = "16:9"
max_batch_size = 10

# ============================================================
#  COMFYUI (Local AI Image Generation)
# ============================================================

[comfyui]
enabled = false
url = "http://127.0.0.1:8188"
output_dir = "./data/media/comfyui"

[comfyui.generation]
default_checkpoint = "v1-5-pruned-emaonly.safetensors"
default_steps = 30
default_cfg = 7.0
default_size = [512, 512]

# ============================================================
#  STABLE DIFFUSION (Local via diffusers)
# ============================================================

[stable_diffusion]
enabled = false
model = "stable-diffusion-v1-5/stable-diffusion-v1-5"
device = "auto"  # auto, cuda, cpu
output_dir = "./data/media/ai_gen"
